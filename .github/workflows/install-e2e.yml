name: install-e2e

# The install a human actually performs, on a machine that has never seen ggrun.
#
# Every install failure reported so far (#18, #26, #27, #28) was "the install
# produced something that cannot run", and no existing job could have caught
# them: they build a fake backend and install from a local directory. This runs
# the real installer and then runs ggrun.
#
# The script is PIPED, as the documented one-liner pipes it. That makes stdin
# the pipe rather than a terminal, which is why a prompt that works when you run
# ./setup.sh hangs forever for a real user. Piping from the checkout rather than
# fetching main means a pull request tests its own installer.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLM_SETUP_NONINTERACTIVE: "1"
  # Python dependencies are deliberately NOT skipped any more. `ggrun download`
  # runs through download_any_gguf.py, so skipping them meant the documented way
  # to get a model was the one part of the install CI never touched. A user does
  # not skip them either.
  #
  # An official ggml-org repo carrying three quants, so the downloader has to
  # choose one rather than take the only file present. Q4_0 is 563 MB.
  E2E_REPO: ggml-org/Qwen3.5-0.8B-GGUF
  E2E_QUANT: Q4_0

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # setup.sh finds a local checkout via ${BASH_SOURCE[0]}. When piped that is
      # empty, so it downloads the source from GitHub -- the real network path a
      # user takes. LLM_SETUP_REF aims that at this commit so a pull request
      # tests its own installer; the backend still comes from the published
      # release, because that is what a user actually receives.
      - name: Install
        env:
          LLM_SETUP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cat setup.sh | bash

      - name: ggrun runs
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" --version
          "$HOME/ggrun/ggrun" detect >/dev/null

      - name: The installed backend runs
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for b in "$HOME/ggrun/.bin/"llama-server*; do
            n=$((n+1)); ls -l "$b"
            timeout 30 "$b" --version </dev/null || { echo "::error::$b did not answer --version"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no backend installed"; exit 1; }

      # A real GGUF, fetched the way a user fetches one. tests/build_synthetic_gguf.py
      # was used here before and proved nothing: it writes headers only, so it has
      # no tensors and no rms epsilon, and a real llama-server rejects it outright
      # ("key not found in model: llama.attention.layer_norm_rms_epsilon"). Only
      # the fake test backend ever "loaded" it. stories260K is 1.1 MB and is what
      # llama.cpp's own server tests use.
      - name: Serve a model
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ggrun/models"
          curl -fsSL --retry 3 --retry-all-errors -o "$HOME/ggrun/models/tiny.gguf" \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          # A runner has no GPU, so ggrun would ask before doing one contained
          # live load. Nothing can answer a prompt in CI, so approve it up front.
          "$HOME/ggrun/ggrun" "$HOME/ggrun/models/tiny.gguf" --cpu --allow-live-memory-probe \
            --host 127.0.0.1 --port 18841 > serve.log 2>&1 &
          ok=
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:18841/health 2>/dev/null | grep -q '"status":"ok"' && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::the installed ggrun could not serve a model"; tail -40 serve.log; exit 1; }
          # Answering /health is not the same as answering a user. Generate.
          curl -fsS -m 60 http://127.0.0.1:18841/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"once upon a time"}],"max_tokens":16}' \
            > reply.json || { echo "::error::generation request failed"; tail -40 serve.log; exit 1; }
          grep -q '"content"' reply.json || {
            echo "::error::served, but generated nothing"; cat reply.json; tail -40 serve.log; exit 1; }
          cat reply.json
          pkill -f 'port 18841' || true

      # The README tells people to get a model with `ggrun download <repo>`.
      # Until now nothing tested that: CI skipped the Python dependencies it
      # needs and fetched its model with curl instead.
      - name: Download a model the documented way
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" download "$E2E_REPO" --quant "$E2E_QUANT"
          shopt -s nullglob
          got=("$HOME/ggrun/models"/*Q4_0*.gguf)
          [ ${#got[@]} -gt 0 ] || {
            echo "::error::ggrun download produced no $E2E_QUANT gguf"; ls -lR "$HOME/ggrun/models"; exit 1; }
          ls -l "${got[0]}"
          echo "MODEL=${got[0]}" >> "$GITHUB_ENV"

      # No --cpu. On a runner with no GPU ggrun detects that and plans for the
      # CPU itself, which is a better test than being told; on a self-hosted
      # machine with cards the same step exercises real placement.
      - name: Serve the downloaded model on whatever hardware exists
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" detect
          "$HOME/ggrun/ggrun" "$MODEL" --allow-live-memory-probe \
            --host 127.0.0.1 --port 18843 > real.log 2>&1 &
          ok=
          for _ in $(seq 1 150); do
            curl -fsS http://127.0.0.1:18843/health 2>/dev/null | grep -q '"status":"ok"' && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::could not serve the downloaded model"; tail -60 real.log; exit 1; }
          curl -fsS -m 120 http://127.0.0.1:18843/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Name one colour. Answer in one word."}],"max_tokens":24}' \
            > real-reply.json || { echo "::error::generation failed"; tail -60 real.log; exit 1; }
          grep -q '"content"' real-reply.json || {
            echo "::error::served, but generated nothing"; cat real-reply.json; tail -60 real.log; exit 1; }
          cat real-reply.json
          grep -E 'placement|context fit' real.log | head -5 || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1, not pwsh 7: it is what the README tells users to
      # run, what #27's reporter used, and the only one that reads a BOM-less
      # UTF-8 script as Windows-1252 (an em-dash in a message broke a whole
      # install once, #18).
      - name: Install
        shell: powershell
        run: Get-Content install.ps1 -Raw | Invoke-Expression

      - name: ggrun runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # install.ps1 writes a ggrun.cmd wrapper at the install root and puts
          # the executable in .bin (Write-CmdWrapper). The wrapper is what the
          # docs tell users to run, so check that, not a bare ggrun.exe.
          $root = Join-Path $env:USERPROFILE 'ggrun'
          $cmd  = Join-Path $root 'ggrun.cmd'
          $exe  = Join-Path $root '.bin\ggrun.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $root -Recurse -Depth 1 | Select-Object FullName; throw "ggrun.exe not at $exe" }
          if (-not (Test-Path $cmd)) { throw "ggrun.cmd wrapper not at $cmd" }
          & $exe --version
          & $exe detect | Out-Null

      - name: The installed backend runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-ChildItem "$env:USERPROFILE\ggrun\.bin" -Filter 'llama-server*.exe' -ErrorAction SilentlyContinue
          if (-not $found) { throw "no backend installed" }
          foreach ($b in $found) { Write-Host $b.FullName; & $b.FullName --version }

      # Same real model as the Linux job -- see the comment there for why the
      # synthetic GGUF that used to be built here could never load.
      - name: Serve a model
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = "$env:USERPROFILE\ggrun"
          New-Item -ItemType Directory -Force -Path "$h\models" | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf' `
            -OutFile "$h\models\tiny.gguf"
          $p = Start-Process "$h\.bin\ggrun.exe" -ArgumentList "$h\models\tiny.gguf",'--cpu','--allow-live-memory-probe','--host','127.0.0.1','--port','18842' `
            -RedirectStandardOutput serve.log -RedirectStandardError serve.err -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..90) {
            try { if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18842/health' -TimeoutSec 5).Content -match '"status":"ok"') { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
            Start-Sleep 2
          }
          if (-not $ok) {
            Get-Content serve.log,serve.err -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "the installed ggrun could not serve a model"
          }
          # Answering /health is not the same as answering a user. Generate.
          $body = '{"messages":[{"role":"user","content":"once upon a time"}],"max_tokens":16}'
          $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18842/v1/chat/completions' `
            -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 60
          if ($r.Content -notmatch '"content"') {
            Write-Host $r.Content
            Get-Content serve.log,serve.err -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "served, but generated nothing"
          }
          Write-Host $r.Content
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      # Same as the Linux job: exercise the downloader the README documents.
      - name: Download a model the documented way
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = "$env:USERPROFILE\ggrun"
          & "$h\.bin\ggrun.exe" download $env:E2E_REPO --quant $env:E2E_QUANT
          if ($LASTEXITCODE -ne 0) { throw "ggrun download exited $LASTEXITCODE" }
          $got = Get-ChildItem "$h\models" -Filter '*Q4_0*.gguf' -ErrorAction SilentlyContinue
          if (-not $got) {
            Get-ChildItem "$h\models" -Recurse | Select-Object FullName
            throw "ggrun download produced no $env:E2E_QUANT gguf"
          }
          Write-Host $got[0].FullName
          "MODEL=$($got[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # No --cpu: let ggrun decide from the hardware it finds.
      - name: Serve the downloaded model on whatever hardware exists
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = "$env:USERPROFILE\ggrun"
          & "$h\.bin\ggrun.exe" detect
          $p = Start-Process "$h\.bin\ggrun.exe" -ArgumentList $env:MODEL,'--allow-live-memory-probe','--host','127.0.0.1','--port','18844' `
            -RedirectStandardOutput real.log -RedirectStandardError real.err -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..150) {
            try { if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18844/health' -TimeoutSec 5).Content -match '"status":"ok"') { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
            Start-Sleep 2
          }
          if (-not $ok) {
            Get-Content real.log,real.err -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw "could not serve the downloaded model"
          }
          $body = '{"messages":[{"role":"user","content":"Name one colour. Answer in one word."}],"max_tokens":24}'
          $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18844/v1/chat/completions' `
            -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 120
          if ($r.Content -notmatch '"content"') {
            Write-Host $r.Content
            Get-Content real.log,real.err -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw "served, but generated nothing"
          }
          Write-Host $r.Content

  # The same human flow on a machine with real cards. GitHub's hosted runners
  # have no GPU, so everything above proves the CPU path only: VRAM admission,
  # placement across devices and split mode are untested by any job here.
  #
  # Opt-in, and skipped rather than queued when the runner does not exist:
  # register a self-hosted runner labelled "gpu" and set the repository variable
  # GGRUN_GPU_RUNNER to "true". Without the `if` this job would sit in the queue
  # forever on a repo with no such runner.
  gpu:
    if: vars.GGRUN_GPU_RUNNER == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner is not a fresh machine, so install somewhere of our
      # own and leave whatever ggrun the owner already has alone.
      - name: Install
        env:
          LLM_SETUP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          LLM_APP_HOME: ${{ github.workspace }}/e2e-home
        run: cat setup.sh | bash

      - name: The GPUs are visible to ggrun
        env:
          LLM_APP_HOME: ${{ github.workspace }}/e2e-home
          CUDA_DEVICE_ORDER: PCI_BUS_ID
        run: |
          set -euo pipefail
          g="$LLM_APP_HOME/ggrun"
          "$g" --version
          "$g" detect | tee detect.txt
          grep -qiE 'cuda|rocm|vulkan|metal|gpu' detect.txt || {
            echo "::error::this runner is labelled gpu and ggrun found no GPU"; exit 1; }

      - name: Download and serve on the GPUs
        env:
          LLM_APP_HOME: ${{ github.workspace }}/e2e-home
          CUDA_DEVICE_ORDER: PCI_BUS_ID
        run: |
          set -euo pipefail
          g="$LLM_APP_HOME/ggrun"
          "$g" download "$E2E_REPO" --quant "$E2E_QUANT"
          shopt -s nullglob
          got=("$LLM_APP_HOME/models"/*Q4_0*.gguf)
          [ ${#got[@]} -gt 0 ] || { echo "::error::no downloaded model"; exit 1; }
          "$g" "${got[0]}" --allow-live-memory-probe --host 127.0.0.1 --port 18845 > gpu.log 2>&1 &
          ok=
          for _ in $(seq 1 240); do
            curl -fsS http://127.0.0.1:18845/health 2>/dev/null | grep -q '"status":"ok"' && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::could not serve on the GPUs"; tail -60 gpu.log; exit 1; }
          curl -fsS -m 120 http://127.0.0.1:18845/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Name one colour. Answer in one word."}],"max_tokens":24}' \
            | tee gpu-reply.json | grep -q '"content"' || {
            echo "::error::served, but generated nothing"; tail -60 gpu.log; exit 1; }
          # A GPU run that quietly placed every layer on the CPU is not a GPU
          # run, and it would pass every check above.
          grep -qE '\-ngl [1-9]|n_gpu_layers|CUDA[0-9]' gpu.log || {
            echo "::error::served, but nothing was placed on a GPU"; tail -60 gpu.log; exit 1; }
          grep -E 'placement|context fit|CUDA[0-9]' gpu.log | head -8

  # Not the human flow -- deliberately. This proves the packaging fix works on a
  # real binary with real shared libraries, which the jobs above cannot do while
  # the published release is still broken. It takes the published llama-server,
  # repackages it with THIS commit's package-release.sh, installs that, and
  # requires the installed backend to run.
  #
  # Delete this job once a release built with the fix has shipped: at that point
  # the human-flow jobs cover it and this is duplicated scaffolding.
  packaging-fix-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Repackage the published backend and install it
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          go build -C go -trimpath -o ../ggrun ./cmd/ggrun
          curl -fsSL -o "$RUNNER_TEMP/pub.tar.gz" \
            https://github.com/raketenkater/ggrun/releases/download/v3.2.8/ggrun-linux-x86_64-cpu.tar.gz
          mkdir -p "$RUNNER_TEMP/pub" && tar -xzf "$RUNNER_TEMP/pub.tar.gz" -C "$RUNNER_TEMP/pub"
          real="$(find "$RUNNER_TEMP/pub" -type f -name llama-server -perm -u+x | head -1)"
          test -n "$real" || { echo "::error::no llama-server in the published bundle"; exit 1; }
          echo "published RUNPATH: $(readelf -d "$real" | grep -oE 'Library runpath: \[[^]]*\]' || echo none)"
          scripts/package-release.sh ggrun-linux-x86_64-cpu.tar.gz "$real" "$RUNNER_TEMP/release"
          ( cd "$RUNNER_TEMP/release" && sha256sum ggrun-linux-x86_64-cpu.tar.gz > SHA256SUMS )
          LLM_APP_HOME="$RUNNER_TEMP/app" LLM_SETUP_MODE=release LLM_SETUP_BACKEND=cpu \
            LLM_INSTALL_RELEASE_DIR="$RUNNER_TEMP/release" ./setup-linux.sh
          b="$RUNNER_TEMP/app/.bin/llama-server"
          echo "installed RUNPATH: $(readelf -d "$(readlink -f "$b")" | grep -oE 'Library runpath: \[[^]]*\]')"
          timeout 30 "$b" --version </dev/null || { echo "::error::repackaged backend still cannot load"; exit 1; }
