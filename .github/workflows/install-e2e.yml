name: install-e2e

# PRs install THIS candidate with a real backend from the pinned prior release.
# Published-release checks separately run the documented network entry points.
# Both paths download a real model, generate, and verify process cleanup.

on:
  push:
    branches: [main, go-core]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      published:
        description: Test the currently published release instead of this candidate
        type: boolean
        default: false

      gpu_model_repo:
        description: Linux GPU model repository (large models are opt-in)
        type: string
        default: ggml-org/Qwen3.5-0.8B-GGUF
      gpu_model_quant:
        description: Linux GPU model quantization
        type: string
        default: Q4_0
      gpu_context:
        description: Total Linux GPU serving context
        type: number
        default: 2048
      gpu_startup_timeout:
        description: Linux GPU launcher readiness timeout in seconds
        type: number
        default: 300
      gpu_request_timeout:
        description: Linux GPU generation timeout in seconds
        type: number
        default: 120
      gpu_min_weight_devices:
        description: Minimum devices with model weight allocations (2 exercises splitting)
        type: number
        default: 1

permissions:
  contents: read

env:
  LLM_SETUP_NONINTERACTIVE: "1"
  # Python dependencies are deliberately NOT skipped any more. `ggrun download`
  # runs through download_any_gguf.py, so skipping them meant the documented way
  # to get a model was the one part of the install CI never touched. A user does
  # not skip them either.
  #
  # An official ggml-org repo carrying three quants, so the downloader has to
  # choose one rather than take the only file present. Q4_0 is 563 MB.
  E2E_REPO: ggml-org/Qwen3.5-0.8B-GGUF
  E2E_QUANT: Q4_0

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install candidate with a real packaged backend
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          go build -C go -trimpath -o ggrun ./cmd/ggrun
          asset=ggrun-linux-x86_64-cpu.tar.gz
          mkdir -p "$RUNNER_TEMP/published" "$RUNNER_TEMP/candidate"
          curl -fL --retry 3 "https://github.com/raketenkater/ggrun/releases/download/v3.2.8/$asset" -o "$RUNNER_TEMP/published/$asset"
          curl -fL --retry 3 https://github.com/raketenkater/ggrun/releases/download/v3.2.8/SHA256SUMS -o "$RUNNER_TEMP/published/SHA256SUMS"
          (cd "$RUNNER_TEMP/published" && grep " $asset$" SHA256SUMS | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/published/$asset" -C "$RUNNER_TEMP/published"
          backend="$(find "$RUNNER_TEMP/published" -type f -name llama-server -print -quit)"
          scripts/package-release.sh "$asset" "$backend" "$RUNNER_TEMP/candidate"
          (cd "$RUNNER_TEMP/candidate" && sha256sum "$asset" > SHA256SUMS)
          LLM_SETUP_MODE=release LLM_SETUP_BACKEND=cpu LLM_INSTALL_SCAN_SYSTEM=0 \
            LLM_INSTALL_RELEASE_DIR="$RUNNER_TEMP/candidate" ./setup-linux.sh

      - name: Install published release through documented entry point
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
        env:
          LLM_INSTALL_SCAN_SYSTEM: "0"
        run: |
          # shellcheck disable=SC2002 # piping the documented entry point is the test
          cat setup.sh | bash

      - name: ggrun runs
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" --version
          "$HOME/ggrun/ggrun" detect >/dev/null

      - name: The installed backend runs
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for b in "$HOME/ggrun/.bin/"llama-server*; do
            n=$((n+1)); ls -l "$b"
            timeout 30 "$b" --version </dev/null || { echo "::error::$b did not answer --version"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no backend installed"; exit 1; }

      # A real GGUF, fetched the way a user fetches one. tests/build_synthetic_gguf.py
      # was used here before and proved nothing: it writes headers only, so it has
      # no tensors and no rms epsilon, and a real llama-server rejects it outright
      # ("key not found in model: llama.attention.layer_norm_rms_epsilon"). Only
      # the fake test backend ever "loaded" it. stories260K is 1.1 MB and is what
      # llama.cpp's own server tests use.
      - name: Serve a model
        run: |
          mkdir -p "$HOME/ggrun/models"
          curl -fsSL --retry 3 -o "$HOME/ggrun/models/tiny.gguf" \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          python3 scripts/verify-installed-serving.py --launcher "$HOME/ggrun/ggrun" \
            --model "$HOME/ggrun/models/tiny.gguf" --cpu --port 18841 --output evidence/tiny

      - name: Reinstall candidate without resetting configuration
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        run: |
          config="$HOME/ggrun/.config/config"
          printf '\nLLM_PORT=19249\n' >> "$config"
          cp "$config" "$RUNNER_TEMP/config-before-upgrade"
          LLM_SETUP_MODE=release LLM_SETUP_BACKEND=cpu LLM_INSTALL_SCAN_SYSTEM=0 \
            LLM_INSTALL_RELEASE_DIR="$RUNNER_TEMP/candidate" ./setup-linux.sh
          cmp "$RUNNER_TEMP/config-before-upgrade" "$config"

      # The README tells people to get a model with `ggrun download <repo>`.
      # Until now nothing tested that: CI skipped the Python dependencies it
      # needs and fetched its model with curl instead.
      - name: Download a model the documented way
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" download "$E2E_REPO" --quant "$E2E_QUANT"
          shopt -s nullglob
          got=("$HOME/ggrun/models"/*Q4_0*.gguf)
          [ ${#got[@]} -gt 0 ] || {
            echo "::error::ggrun download produced no $E2E_QUANT gguf"; ls -lR "$HOME/ggrun/models"; exit 1; }
          ls -l "${got[0]}"
          echo "MODEL=${got[0]}" >> "$GITHUB_ENV"

      # No --cpu. On a runner with no GPU ggrun detects that and plans for the
      # CPU itself, which is a better test than being told; on a self-hosted
      # machine with cards the same step exercises real placement.
      - name: Serve the downloaded model on whatever hardware exists
        run: python3 scripts/verify-installed-serving.py --launcher "$HOME/ggrun/ggrun" --model "$MODEL" --port 18843 --output evidence/downloaded

      - name: Preserve install and serving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-install-evidence
          path: |
            evidence/
            ~/ggrun/.logs/setup-*.log


  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install candidate with a real packaged backend
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          go build -C go -trimpath -o ggrun.exe ./cmd/ggrun
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          $asset = 'ggrun-windows-x86_64-cpu.zip'
          $published = Join-Path $env:RUNNER_TEMP 'published'
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          New-Item -ItemType Directory -Force -Path $published,$candidate | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/raketenkater/ggrun/releases/download/v3.2.8/$asset" -OutFile "$published/$asset"
          Invoke-WebRequest -UseBasicParsing 'https://github.com/raketenkater/ggrun/releases/download/v3.2.8/SHA256SUMS' -OutFile "$published/SHA256SUMS"
          $line = Get-Content "$published/SHA256SUMS" | Where-Object { $_ -match " $([regex]::Escape($asset))$" }
          if (!$line -or (Get-FileHash "$published/$asset" -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line -split '\s+')[0]) { throw 'Published backend checksum mismatch' }
          Expand-Archive "$published/$asset" "$published/unpacked"
          $backend = Get-ChildItem "$published/unpacked" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (!$backend) { throw 'Published backend missing' }
          ./scripts/package-release.ps1 -AssetName $asset -ServerBin $backend.FullName -OutDir $candidate -LlmServerBin go/ggrun.exe
          $hash = (Get-FileHash "$candidate/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$candidate/SHA256SUMS" -Encoding ASCII
          ./install.ps1 -InstallDir "$env:USERPROFILE/ggrun" -ReleaseDir $candidate -Backend cpu -NoPath -AssumeYes

      - name: Install published release through documented entry point
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
        shell: powershell
        run: Get-Content install.ps1 -Raw | Invoke-Expression

      - name: ggrun runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # install.ps1 writes a ggrun.cmd wrapper at the install root and puts
          # the executable in .bin (Write-CmdWrapper). The wrapper is what the
          # docs tell users to run, so check that, not a bare ggrun.exe.
          $root = Join-Path $env:USERPROFILE 'ggrun'
          $cmd  = Join-Path $root 'ggrun.cmd'
          $exe  = Join-Path $root '.bin\ggrun.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $root -Recurse -Depth 1 | Select-Object FullName; throw "ggrun.exe not at $exe" }
          if (-not (Test-Path $cmd)) { throw "ggrun.cmd wrapper not at $cmd" }
          & $cmd --version
          if ($LASTEXITCODE -ne 0) { throw "Wrapper version failed" }
          & $cmd detect | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Wrapper detect failed" }

      - name: The installed backend runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-ChildItem "$env:USERPROFILE\ggrun\.bin" -Filter 'llama-server*.exe' -ErrorAction SilentlyContinue
          if (-not $found) { throw "no backend installed" }
          foreach ($b in $found) { Write-Host $b.FullName; & $b.FullName --version; if ($LASTEXITCODE -ne 0) { throw "Backend version failed" } }

      # Same real model as the Linux job -- see the comment there for why the
      # synthetic GGUF that used to be built here could never load.
      - name: Serve a model
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'ggrun'
          New-Item -ItemType Directory -Force -Path "$root\models" | Out-Null
          Invoke-WebRequest -UseBasicParsing 'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf' -OutFile "$root\models\tiny.gguf"
          python scripts/verify-installed-serving.py --launcher "$root\ggrun.cmd" --model "$root\models\tiny.gguf" --cpu --port 18842 --output evidence/tiny
          if ($LASTEXITCODE -ne 0) { throw 'Installed serving check failed' }

      - name: Reinstall candidate without resetting configuration
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:USERPROFILE 'ggrun'
          $config = Join-Path $app '.config/config'
          Add-Content $config "`nLLM_PORT=19249"
          $before = (Get-FileHash $config).Hash
          ./install.ps1 -InstallDir $app -ReleaseDir "$env:RUNNER_TEMP/candidate" -Backend cpu -NoPath -AssumeYes
          if ((Get-FileHash $config).Hash -ne $before) { throw 'Reinstall changed user configuration' }

      # Same as the Linux job: exercise the downloader the README documents.
      - name: Download a model the documented way
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = "$env:USERPROFILE\ggrun"
          & "$h\.bin\ggrun.exe" download $env:E2E_REPO --quant $env:E2E_QUANT
          if ($LASTEXITCODE -ne 0) { throw "ggrun download exited $LASTEXITCODE" }
          $got = Get-ChildItem "$h\models" -Filter '*Q4_0*.gguf' -ErrorAction SilentlyContinue
          if (-not $got) {
            Get-ChildItem "$h\models" -Recurse | Select-Object FullName
            throw "ggrun download produced no $env:E2E_QUANT gguf"
          }
          Write-Host $got[0].FullName
          "MODEL=$($got[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # No --cpu: let ggrun decide from the hardware it finds.
      - name: Serve the downloaded model on whatever hardware exists
        shell: powershell
        run: |
          python scripts/verify-installed-serving.py --launcher "$env:USERPROFILE\ggrun\ggrun.cmd" --model "$env:MODEL" --port 18844 --output evidence/downloaded
          if ($LASTEXITCODE -ne 0) { throw 'Installed serving check failed' }

      - name: Exercise Windows server hardening script with candidate CPU bundle
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        shell: powershell
        run: |
          ./scripts/test-windows-server.ps1 -WorkDir "$env:RUNNER_TEMP/server check" `
            -ReleaseDir "$env:RUNNER_TEMP/candidate" -Backend cpu -MinWeightDevices 0 `
            -ModelPath "$env:MODEL" -Context 2048 -StartupTimeout 300 -Port 18846

      - name: Preserve Windows server hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-hardening
          path: |
            ${{ runner.temp }}/server check/evidence/**
            !${{ runner.temp }}/server check/evidence/**/downloaded-models/**

      - name: Preserve install and serving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-evidence
          path: |
            evidence/
            ~/ggrun/.logs/

  # The same human flow on a machine with real cards. GitHub's hosted runners
  # have no GPU, so everything above proves the CPU path only: VRAM admission,
  # placement across devices and split mode are untested by any job here.
  #
  # Opt-in, and skipped rather than queued when the runner does not exist:
  # register a self-hosted runner labelled "gpu" and set the repository variable
  # GGRUN_GPU_RUNNER to "true". Without the `if` this job would sit in the queue
  # forever on a repo with no such runner.
  gpu:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.GGRUN_GPU_RUNNER == 'true'
    # Linux label so a Windows GPU runner cannot pick up this job.
    runs-on: [self-hosted, gpu, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner is not a fresh machine, so install somewhere of our
      # own and leave whatever ggrun the owner already has alone.
      - name: Install
        env:
          LLM_INSTALL_SCAN_SYSTEM: "0"
          LLM_SETUP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          LLM_APP_HOME: ${{ runner.temp }}/ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # shellcheck disable=SC2002 # piping the documented entry point is the test
          cat setup.sh | bash

      - name: The GPUs are visible to ggrun
        env:
          LLM_APP_HOME: ${{ runner.temp }}/ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CUDA_DEVICE_ORDER: PCI_BUS_ID
        run: |
          set -euo pipefail
          g="$LLM_APP_HOME/ggrun"
          "$g" --version
          "$g" detect | tee detect.txt
          grep -qiE 'cuda|rocm|vulkan|metal|gpu' detect.txt || {
            echo "::error::this runner is labelled gpu and ggrun found no GPU"; exit 1; }

      - name: Download and serve on the GPUs
        env:
          LLM_APP_HOME: ${{ runner.temp }}/ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CUDA_DEVICE_ORDER: PCI_BUS_ID
          GPU_MODEL_REPO: ${{ inputs.gpu_model_repo }}
          GPU_MODEL_QUANT: ${{ inputs.gpu_model_quant }}
          GPU_CONTEXT: ${{ inputs.gpu_context }}
          GPU_STARTUP_TIMEOUT: ${{ inputs.gpu_startup_timeout }}
          GPU_REQUEST_TIMEOUT: ${{ inputs.gpu_request_timeout }}
          GPU_MIN_WEIGHT_DEVICES: ${{ inputs.gpu_min_weight_devices }}
        run: |
          python3 scripts/verify-gpu-install.py --launcher "$LLM_APP_HOME/ggrun" \
            --repo "${GPU_MODEL_REPO:-$E2E_REPO}" --quant "${GPU_MODEL_QUANT:-$E2E_QUANT}" \
            --ctx "${GPU_CONTEXT:-2048}" --timeout "${GPU_STARTUP_TIMEOUT:-300}" \
            --request-timeout "${GPU_REQUEST_TIMEOUT:-120}" \
            --min-weight-devices "${GPU_MIN_WEIGHT_DEVICES:-1}" \
            --port 18845 --output evidence/gpu

      - name: Preserve GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-install-evidence
          path: |
            evidence/gpu/*.json
            evidence/gpu/*.log

  # Same flow on a Windows machine with cards. Gated on its own variable so one
  # platform's runner being absent never leaves the other's job queued.
  # Register a self-hosted Windows runner labelled "gpu" and set
  # GGRUN_GPU_RUNNER_WINDOWS to "true".
  gpu-windows:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.GGRUN_GPU_RUNNER_WINDOWS == 'true'
    runs-on: [self-hosted, gpu, Windows]
    timeout-minutes: 60
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      # Install THIS commit, packaged the way the hosted windows job does it.
      # Installing the published release instead tested a binary 50 commits
      # behind main: v3.2.8 sent a fixed 6924-token cache canary into a
      # 2048-token context and exited, a bug #30 had already fixed on main.
      #
      # Called with parameters rather than piped. A self-hosted machine is not
      # a fresh one: -InstallDir keeps this out of the owner's real ~\ggrun, and
      # -NoPath leaves their PATH alone. No -Backend: install.ps1 detects the
      # card, finds no CUDA bundle in the candidate, installs the CPU bundle
      # and adds the prebuilt llama.cpp CUDA backend, as it does for a user.
      - name: Install candidate
        shell: powershell
        env:
          LLM_APP_HOME: ${{ runner.temp }}\ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          LLM_INSTALL_SCAN_SYSTEM: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          go build -C go -trimpath -o ggrun.exe ./cmd/ggrun
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          $asset = 'ggrun-windows-x86_64-cpu.zip'
          $published = Join-Path $env:RUNNER_TEMP 'published'
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          New-Item -ItemType Directory -Force -Path $published,$candidate | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/raketenkater/ggrun/releases/download/v3.2.8/$asset" -OutFile "$published/$asset"
          Invoke-WebRequest -UseBasicParsing 'https://github.com/raketenkater/ggrun/releases/download/v3.2.8/SHA256SUMS' -OutFile "$published/SHA256SUMS"
          $line = Get-Content "$published/SHA256SUMS" | Where-Object { $_ -match " $([regex]::Escape($asset))$" }
          if (!$line -or (Get-FileHash "$published/$asset" -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line -split '\s+')[0]) { throw 'Published backend checksum mismatch' }
          Expand-Archive "$published/$asset" "$published/unpacked"
          $backend = Get-ChildItem "$published/unpacked" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (!$backend) { throw 'Published backend missing' }
          ./scripts/package-release.ps1 -AssetName $asset -ServerBin $backend.FullName -OutDir $candidate -LlmServerBin go/ggrun.exe
          $hash = (Get-FileHash "$candidate/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$candidate/SHA256SUMS" -Encoding ASCII
          .\install.ps1 -InstallDir $env:LLM_APP_HOME -ReleaseDir $candidate -NoPath -AssumeYes
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "install.ps1 exited $LASTEXITCODE" }

      - name: The GPUs are visible to ggrun
        shell: powershell
        env:
          LLM_APP_HOME: ${{ runner.temp }}\ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $g = Join-Path $env:LLM_APP_HOME '.bin\ggrun.exe'
          if (-not (Test-Path $g)) { throw "ggrun.exe not at $g" }
          & $g --version
          & $g detect | Tee-Object -FilePath detect.txt
          if (-not (Select-String -Path detect.txt -Pattern 'cuda|vulkan|gpu' -Quiet)) {
            throw "this runner is labelled gpu and ggrun found no GPU"
          }

      - name: Download and serve on the GPUs
        shell: powershell
        env:
          LLM_APP_HOME: ${{ runner.temp }}\ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $g = Join-Path $env:LLM_APP_HOME '.bin\ggrun.exe'
          & $g download $env:E2E_REPO --quant $env:E2E_QUANT
          if ($LASTEXITCODE -ne 0) { throw "ggrun download exited $LASTEXITCODE" }
          $got = Get-ChildItem (Join-Path $env:LLM_APP_HOME 'models') -Filter '*Q4_0*.gguf' -ErrorAction SilentlyContinue
          if (-not $got) { throw "no downloaded model" }
          python scripts/verify-installed-serving.py --launcher $g --model $got[0].FullName --port 18846 --output evidence/gpu-windows
          if ($LASTEXITCODE -ne 0) { throw "installed serving check failed" }
          # A run that quietly placed everything on the CPU would pass every
          # check above. Require a real, nonzero weight allocation on a device.
          # Backends word this differently, so match either spelling and drop
          # the KV, compute and output buffers, which a device allocates even
          # when the weights stayed on the host:
          #   mainline  CUDA0 model buffer size =   526.50 MiB
          #   ik_llama  llm_load_tensors: CUDA1 buffer size =   526.50 MiB
          $log = Join-Path 'evidence/gpu-windows' 'serve.log'
          $weights = Select-String -Path $log -Pattern '(CUDA\d+|Vulkan\d+|Metal).*buffer size *= *[1-9][0-9.]* MiB' |
            Where-Object { $_.Line -notmatch 'KV buffer|compute buffer|output buffer' }
          if (-not $weights) {
            throw "No positive device weight allocation recorded"
          }

      - name: Preserve GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-windows-install-evidence
          path: evidence/
