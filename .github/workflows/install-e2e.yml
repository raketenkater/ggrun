name: install-e2e

# PRs install THIS candidate with a real backend from the pinned prior release.
# Published-release checks separately run the documented network entry points.
# Both paths download a real model, generate, and verify process cleanup.

on:
  push:
    branches: [main, go-core]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      published:
        description: Test the currently published release instead of this candidate
        type: boolean
        default: false

      gpu_model_repo:
        description: Linux GPU model repository (large models are opt-in)
        type: string
        default: ggml-org/Qwen3.5-0.8B-GGUF
      gpu_model_quant:
        description: Linux GPU model quantization
        type: string
        default: Q4_0
      gpu_model_path:
        description: Existing GGUF on the Linux GPU runner; skips downloading (for models too large to fetch per run)
        type: string
        default: ""
      gpu_context:
        description: Total Linux GPU serving context (0 selects it automatically)
        type: number
        default: 2048
      gpu_startup_timeout:
        description: Linux GPU launcher readiness timeout in seconds
        type: number
        default: 300
      gpu_request_timeout:
        description: Linux GPU generation timeout in seconds
        type: number
        default: 120
      gpu_min_weight_devices:
        description: Minimum devices with model weight allocations (2 exercises splitting)
        type: number
        default: 1
      gpu_claude_code:
        description: Also serve once in Claude Code mode (--claude-code --parallel 1)
        type: boolean
        default: true

permissions:
  contents: read

env:
  LLM_SETUP_NONINTERACTIVE: "1"
  # Python dependencies are deliberately NOT skipped any more. `ggrun download`
  # runs through download_any_gguf.py, so skipping them meant the documented way
  # to get a model was the one part of the install CI never touched. A user does
  # not skip them either.
  #
  # An official ggml-org repo carrying three quants, so the downloader has to
  # choose one rather than take the only file present. Q4_0 is 563 MB.
  E2E_REPO: ggml-org/Qwen3.5-0.8B-GGUF
  E2E_QUANT: Q4_0

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install candidate with a real packaged backend
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          go build -C go -trimpath -o ggrun ./cmd/ggrun
          asset=ggrun-linux-x86_64-cpu.tar.gz
          mkdir -p "$RUNNER_TEMP/published" "$RUNNER_TEMP/candidate"
          curl -fL --retry 3 "https://github.com/raketenkater/ggrun/releases/download/v3.2.10/$asset" -o "$RUNNER_TEMP/published/$asset"
          curl -fL --retry 3 https://github.com/raketenkater/ggrun/releases/download/v3.2.10/SHA256SUMS -o "$RUNNER_TEMP/published/SHA256SUMS"
          (cd "$RUNNER_TEMP/published" && grep " $asset$" SHA256SUMS | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/published/$asset" -C "$RUNNER_TEMP/published"
          backend="$(find "$RUNNER_TEMP/published" -type f -name llama-server -print -quit)"
          scripts/package-release.sh "$asset" "$backend" "$RUNNER_TEMP/candidate"
          (cd "$RUNNER_TEMP/candidate" && sha256sum "$asset" > SHA256SUMS)
          LLM_SETUP_MODE=release LLM_SETUP_BACKEND=cpu LLM_INSTALL_SCAN_SYSTEM=0 \
            LLM_INSTALL_RELEASE_DIR="$RUNNER_TEMP/candidate" ./setup-linux.sh

      - name: Install published release through documented entry point
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
        env:
          LLM_INSTALL_SCAN_SYSTEM: "0"
        run: |
          # shellcheck disable=SC2002 # piping the documented entry point is the test
          cat setup.sh | bash

      - name: ggrun runs
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" --version
          "$HOME/ggrun/ggrun" detect >/dev/null

      # Which launcher was installed is the first thing to prove: a candidate job
      # must run this commit, and the documented auto path builds main from
      # source and can keep an older binary when that build fails.
      - name: Installed launcher identity
        env:
          PUBLISHED: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          "$HOME/ggrun/ggrun" version --json | tee evidence/launcher-identity.json
          sha256sum "$HOME/ggrun/.bin/"ggrun* "$HOME/ggrun/.bin/"llama-server* | tee evidence/installed-sha256.txt
          main_head="$(git ls-remote https://github.com/raketenkater/ggrun refs/heads/main | cut -f1)"
          python3 - "$main_head" <<'EOF'
          import json, os, re, sys
          ident = json.load(open("evidence/launcher-identity.json"))
          rev, ver, sha = ident.get("revision") or "", ident.get("version") or "", os.environ["GITHUB_SHA"]
          if os.environ["PUBLISHED"] == "true":
              # default auto mode builds main from source
              ok = any(rev == c or re.search("-g" + c[:7], ver) for c in (sha, sys.argv[1]) if c)
          else:
              ok = rev == sha
              # The wrapper's bytes are the same for every build: the executable
              # that answered must be the installed one hashed above.
              installed = os.path.realpath(os.path.expanduser("~/ggrun/.bin/ggrun"))
              if ident.get("executable_resolved") != installed:
                  sys.exit(f"::error::the wrapper ran {ident.get('executable_resolved')}, not {installed}")
          if not ok:
              sys.exit(f"::error::installed launcher {ident} is not this revision ({sha})")
          print("launcher revision verified:", rev or ver)
          EOF

      # Published-path only: the documented auto path above builds from source,
      # so it cannot prove the release archive. Install the release alone.
      - name: The published release archive installs as itself
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
        env:
          LLM_INSTALL_SCAN_SYSTEM: "0"
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          [ -n "$tag" ] || tag="$(curl -fsSL https://api.github.com/repos/raketenkater/ggrun/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')"
          LLM_APP_HOME="$RUNNER_TEMP/release-only" LLM_SETUP_MODE=release LLM_INSTALL_RELEASE="$tag" \
            LLM_SETUP_BACKEND=cpu ./setup-linux.sh
          got="$("$RUNNER_TEMP/release-only/ggrun" --version)"
          echo "$got" | tee evidence/release-only-version.txt
          [ "$got" = "ggrun $tag" ] || { echo "::error::release-only install reports '$got', expected 'ggrun $tag'"; exit 1; }

      - name: The installed backend runs
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for b in "$HOME/ggrun/.bin/"llama-server*; do
            n=$((n+1)); ls -l "$b"
            timeout 30 "$b" --version </dev/null || { echo "::error::$b did not answer --version"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no backend installed"; exit 1; }

      # Automatic backend selection trusts this probe to say which architectures
      # the installed loader knows; a probe that cannot read the shipped layout
      # refuses every model.
      - name: The architecture probe reads the installed backend
        run: |
          GGRUN_ARCH_PROBE_BACKEND="$HOME/ggrun/.bin/llama-server" \
            go test -C go -count=1 ./pkg/backends -run TestArchProbeOnInstalledBackend -v

      # The README tells people to get a model with `ggrun download <repo>`, and
      # this is the only place that path is tested. It runs first so both serve
      # steps share the one download rather than fetching 563 MB twice.
      #
      # A real model, not a fixture. The stories GGUFs that used to be served
      # here have training contexts no real model has, so CI kept asserting
      # against behaviour no user ever meets.
      - name: Download a model the documented way
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" download "$E2E_REPO" --quant "$E2E_QUANT"
          shopt -s nullglob
          got=("$HOME/ggrun/models"/*Q4_0*.gguf)
          [ ${#got[@]} -gt 0 ] || {
            echo "::error::ggrun download produced no $E2E_QUANT gguf"; ls -lR "$HOME/ggrun/models"; exit 1; }
          ls -l "${got[0]}"
          echo "MODEL=${got[0]}" >> "$GITHUB_ENV"

      # The installed backend's log must still be readable by ggrun's planner
      # parsers (review I-05); a wording change upstream fails here, not as a
      # silent fallback to estimates on users' machines.
      - name: Backend contract check
        run: |
          set -euo pipefail
          "$HOME/ggrun/ggrun" backend verify --model "$MODEL" --timeout 5m

      # The repo/quant above is fixed by this workflow. A user instead follows
      # ggrun's recommendation for the machine, so do that too: the top pick is
      # checked to be a complete artifact and its bytes must match the catalog.
      - name: Follow ggrun's recommendation for this runner
        run: |
          set -euo pipefail
          python3 scripts/verify-recommended-download.py --launcher "$HOME/ggrun/ggrun" \
            --models-dir "$HOME/ggrun/models" --output evidence/recommended --max-download-gb 6 | tee rec.out
          grep '^MODEL=' rec.out | sed 's/^MODEL=/REC_MODEL=/' >> "$GITHUB_ENV"

      - name: Serve a model
        run: |
          python3 scripts/verify-installed-serving.py --launcher "$HOME/ggrun/ggrun" \
            --model "$MODEL" --cpu --port 18841 --output evidence/cpu --hash-model

      # Unattended serving uses the shipped user unit (review C-08): ggrun's
      # memory scopes need a user manager, which a system unit with User=
      # does not have.
      - name: Serve through the shipped systemd user unit
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          # Shared with the stop-during-load step: what is left of a stopped unit.
          cat > "$RUNNER_TEMP/unit-diag.sh" <<'EOF'
          ucg="/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service"
          backend_scopes() { find "$ucg" -maxdepth 3 -type d -name 'ggrun-backend-*.scope' 2>/dev/null || true; }
          scope_pids() { local sc; for sc in $(backend_scopes); do cat "$sc/cgroup.procs" 2>/dev/null || true; done; }
          port_pids() { ss -ltnpH "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true; }
          answering() { curl -fs --max-time 1 "http://127.0.0.1:$1/health" >/dev/null 2>&1; }
          proc_line() {
            [ -r "/proc/$1/status" ] || return 0
            printf '%s pgid=%s cg=%s %s| %s\n' "$1" "$(ps -o pgid= -p "$1" | tr -d ' ')" \
              "$(cut -d: -f3 "/proc/$1/cgroup" 2>/dev/null)" \
              "$(awk '/^(Name|State|PPid|SigBlk|SigIgn|SigCgt):/{printf "%s%s ", $1, $2}' "/proc/$1/status" 2>/dev/null)" \
              "$(tr '\0\n' '  ' < "/proc/$1/cmdline" 2>/dev/null | cut -c1-160)"
          }
          # unit_diag PORT SINCE_EPOCH
          unit_diag() {
            local u p
            echo "::group::diagnostics for port $1"
            echo "--- ggrun unit journal since start"
            journalctl --user -u ggrun -o short-unix --no-pager 2>/dev/null | awk -v s="$2" '$1+0 >= s' | tail -300 || true
            echo "--- backend scope journal since start"
            journalctl --user -u 'ggrun-backend-*' -o short-unix --no-pager 2>/dev/null | awk -v s="$2" '$1+0 >= s' | tail -40 || true
            echo "--- unit status"
            systemctl --user status ggrun --no-pager -l 2>&1 | head -30 || true
            systemctl --user list-units --all --no-pager --plain 'ggrun*' 2>&1 || true
            for u in $(systemctl --user list-units --all --no-legend --plain 'ggrun-backend-*' 2>/dev/null | awk '{print $1}'); do
              systemctl --user status "$u" --no-pager -l 2>&1 | head -30 || true
            done
            echo "--- user cgroups"
            systemd-cgls --no-pager "${ucg#/sys/fs/cgroup}" 2>&1 | head -60 || true
            for u in $(backend_scopes); do echo "$u: $(tr '\n' ' ' < "$u/cgroup.procs" 2>/dev/null)"; done
            echo "--- processes"
            ps -eo pid,ppid,pgid,sid,etime,stat,args | cut -c1-220 | awk 'NR==1 || /ggrun|llama-server|scope-watch|systemd-run/' | grep -v -e ' awk ' -e unit-diag || true
            echo "--- port listeners and scope members"
            for p in $(port_pids "$1") $(scope_pids); do proc_line "$p"; done | sort -u || true
            ss -ltnp "sport = :$1" 2>&1 || true
            echo "::endgroup::"
          }
          # Explicit PIDs and unit names only; never a pattern kill.
          cleanup_backends() {
            local u p
            if systemctl --user is-active --quiet ggrun; then systemctl --user kill -s KILL ggrun 2>/dev/null || true; fi
            for u in $(systemctl --user list-units --all --no-legend --plain 'ggrun-backend-*' 2>/dev/null | awk '{print $1}'); do
              timeout 20 systemctl --user stop "$u" 2>/dev/null || true
            done
            for p in $(port_pids "$1") $(scope_pids); do kill -KILL "$p" 2>/dev/null || true; done
            for _ in $(seq 10); do answering "$1" || break; sleep 1; done
            systemctl --user reset-failed 2>/dev/null || true
          }
          EOF
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/unit-diag.sh"
          mkdir -p ~/.config/systemd/user ~/.config/ggrun
          sed "s|%h/.local/bin/ggrun|$HOME/ggrun/ggrun|" examples/systemd/ggrun.service > ~/.config/systemd/user/ggrun.service
          printf 'GGRUN_MODEL=%s\nGGRUN_ARGS=--cpu --port 18849 --ctx 2048\n' "$MODEL" > ~/.config/ggrun/service.env
          systemctl --user daemon-reload
          since="$(date +%s.%N)"
          systemctl --user start ggrun
          up=0
          for _ in $(seq 180); do
            if curl -fs http://127.0.0.1:18849/health >/dev/null; then up=1; break; fi
            systemctl --user is-active --quiet ggrun || break
            sleep 2
          done
          journalctl --user -u ggrun --no-pager | tail -40
          [ "$up" = 1 ] || { echo "::error::the user unit did not serve"; exit 1; }
          systemctl --user stop ggrun
          if systemctl --user is-active --quiet ggrun; then
            unit_diag 18849 "$since"; cleanup_backends 18849
            echo "::error::unit still active after stop"; exit 1
          fi
          # The backend runs in its own memory scope; its watcher stops it a
          # few seconds after the launcher exits.
          for _ in $(seq 30); do curl -fs http://127.0.0.1:18849/health >/dev/null || break; sleep 1; done
          if curl -fs http://127.0.0.1:18849/health >/dev/null; then
            unit_diag 18849 "$since"; cleanup_backends 18849
            echo "::error::server still answering 30s after stop"; exit 1
          fi

      # Diagnostic only: stop the unit at controlled moments of the launch and
      # record whether the backend outlives its launcher.
      - name: Stop during load (diagnostic)
        if: ${{ !cancelled() && env.MODEL != '' }}
        continue-on-error: true
        timeout-minutes: 7
        run: |
          set -euo pipefail
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          [ -f "$RUNNER_TEMP/unit-diag.sh" ] || { echo "::error::unit-diag.sh missing (systemd step did not run)"; exit 1; }
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/unit-diag.sh"
          table="$RUNNER_TEMP/stop-during-load.tsv"
          printf 'iter\tmoment\tport\tstop_s\thealthy_at_stop\tdown_10s\tdown_30s\tdown_after_s\tsurvivors\tlast_launcher_line\n' > "$table"
          print_table() {
            echo "=== stop-during-load summary"
            column -t -s "$(printf '\t')" "$table" || cat "$table"
            echo "=== per moment: tries, still answering at 10 s, at 30 s"
            awk -F'\t' 'NR>1 { n[$2]++; if ($6=="no") a[$2]++; if ($7=="no") b[$2]++ } END { for (m in n) printf "%-16s %3d %3d %3d\n", m, n[m], a[m]+0, b[m]+0 }' "$table" | sort
            { echo '### Stop during load'; echo '```'; column -t -s "$(printf '\t')" "$table" || cat "$table"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          trap print_table EXIT
          step_start=$SECONDS
          i=0
          # Controls first, then cycle the stop moments around readiness until
          # the time budget is spent: a rare race needs many attempts.
          controls=(start start+0.5s server-running)
          cycle=(first-listen first-healthy healthy+0.2s healthy+1s like-unit-step)
          while :; do
            if [ "$i" -lt "${#controls[@]}" ]; then moment="${controls[$i]}"
            else moment="${cycle[$(( (i - ${#controls[@]}) % ${#cycle[@]} ))]}"; fi
            if [ $((SECONDS - step_start)) -gt 180 ]; then echo "time budget reached after $i iterations"; break; fi
            i=$((i+1)); port=$((18860 + i))
            printf 'GGRUN_MODEL=%s\nGGRUN_ARGS=--cpu --port %s --ctx 2048\n' "$MODEL" "$port" > ~/.config/ggrun/service.env
            systemctl --user reset-failed ggrun 2>/dev/null || true
            since="$(date +%s.%N)"
            systemctl --user start ggrun
            case "$moment" in
              start) ;;
              start+0.5s) sleep 0.5 ;;
              first-listen)
                for _ in $(seq 900); do
                  [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 "http://127.0.0.1:$port/health" || true)" != 000 ] && break
                  systemctl --user is-active --quiet ggrun || break; sleep 0.05
                done ;;
              first-healthy|healthy+0.2s|healthy+1s)
                for _ in $(seq 900); do answering "$port" && break; systemctl --user is-active --quiet ggrun || break; sleep 0.1; done
                case "$moment" in healthy+0.2s) sleep 0.2 ;; healthy+1s) sleep 1 ;; esac ;;
              like-unit-step)
                # The unit step's own cadence: 2 s polls, then a journal read.
                for _ in $(seq 180); do answering "$port" && break; systemctl --user is-active --quiet ggrun || break; sleep 2; done
                journalctl --user -u ggrun --no-pager 2>/dev/null | tail -40 >/dev/null || true ;;
              server-running)
                for _ in $(seq 360); do
                  if journalctl --user -u ggrun -o short-unix --no-pager 2>/dev/null | awk -v s="$since" '$1+0 >= s' \
                    | grep "Server running on port $port" >/dev/null; then break; fi
                  systemctl --user is-active --quiet ggrun || break
                  sleep 0.25
                done ;;
            esac
            healthy=no; answering "$port" && healthy=yes
            t_stop="$(date +%s.%N)"
            systemctl --user stop ggrun || true
            t_stopped="$(date +%s.%N)"
            stop_s="$(awk -v a="$t_stop" -v b="$t_stopped" 'BEGIN{printf "%.2f", b-a}')"
            if systemctl --user is-active --quiet ggrun; then echo "::warning::iteration $i: unit still active after stop"; fi
            down_after=-; down10=no; down30=no; survivors=-
            while :; do
              el="$(awk -v a="$t_stopped" -v b="$(date +%s.%N)" 'BEGIN{printf "%.1f", b-a}')"
              if ! answering "$port"; then
                down_after="$el"; down30=yes
                awk -v e="$el" 'BEGIN{exit !(e <= 10)}' && down10=yes
                break
              fi
              if [ "$down10" = no ] && [ "$survivors" = - ] && awk -v e="$el" 'BEGIN{exit !(e > 10)}'; then
                survivors="$(for p in $(port_pids "$port") $(scope_pids); do printf '%s:%s ' "$p" "$(cat "/proc/$p/comm" 2>/dev/null)"; done)"
                survivors="${survivors:-none}"
                echo "iteration $i ($moment): still answering 10s after stop"
                unit_diag "$port" "$since"
              fi
              awk -v e="$el" 'BEGIN{exit !(e > 30)}' && break
              sleep 0.5
            done
            if [ "$down30" = no ]; then
              echo "iteration $i ($moment): still answering 30s after stop"
              for p in $(port_pids "$port") $(scope_pids); do proc_line "$p"; done | sort -u || true
            fi
            last="$(journalctl --user -u ggrun -o short-unix --no-pager 2>/dev/null \
              | awk -v s="$since" -v t="$t_stop" '$1+0 >= s && $1+0 < t { sub(/^[^ ]+ [^ ]+ [^ ]+: /, ""); if ($0 ~ /^\[/) l=$0 } END { print l }' \
              | tr '\t' ' ' | cut -c1-90 || true)"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$i" "$moment" "$port" "$stop_s" "$healthy" "$down10" "$down30" \
              "$down_after" "$survivors" "${last:-<none>}" >> "$table"
            cleanup_backends "$port"
          done

      - name: Update the previous Linux release to this candidate
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        run: |
          set -euo pipefail
          previous=v3.2.13
          asset=ggrun-linux-x86_64-cpu.tar.gz
          release="https://github.com/raketenkater/ggrun/releases/download/$previous"
          upgrade="$(mktemp -d "$RUNNER_TEMP/upgrade.XXXXXX")"
          mkdir -p "$upgrade/home" "$upgrade/bundle"
          curl -fL --retry 3 "$release/$asset" -o "$upgrade/bundle/$asset"
          curl -fL --retry 3 "$release/SHA256SUMS" -o "$upgrade/bundle/SHA256SUMS"
          app="$upgrade/home/ggrun"
          HOME="$upgrade/home" LLM_SETUP_MODE=release LLM_SETUP_BACKEND=cpu LLM_INSTALL_SCAN_SYSTEM=0 \
            LLM_SETUP_DEPS=skip LLM_SETUP_PY_DEPS=skip LLM_SETUP_REF="$previous" \
            LLM_INSTALL_RELEASE_DIR="$upgrade/bundle" ./setup-linux.sh
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          export GOCACHE GOMODCACHE
          export HOME="$upgrade/home"
          "$app/ggrun" version --json > "$upgrade/before.json"
          test ! -e "$app/.src/ggrun/.git"
          config="$app/.config/config"
          printf '\nLLM_PORT=19249\n' >> "$config"
          printf 'preserve model directory\n' > "$app/models/upgrade-marker"
          printf 'preserve cache directory\n' > "$app/.cache/upgrade-marker"
          sha256sum "$config" "$app/models/upgrade-marker" "$app/.cache/upgrade-marker" \
            "$app/.bin/llama-server" > "$upgrade/preserved.sha256"

          # Seed a source-backed app home at the same release. A private Git
          # remote makes the update target deterministic on PRs.
          mirror="$upgrade/candidate.git"
          git init --bare --quiet "$mirror"
          release_commit="$(git rev-parse "$previous^{commit}")"
          git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA"
          git -C "$mirror" fetch --quiet "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C "$mirror" update-ref refs/heads/main "$release_commit"
          git clone --quiet --branch main "$mirror" "$app/.src/ggrun"
          git -C "$mirror" update-ref refs/heads/main "$GITHUB_SHA" "$release_commit"
          (
            cd "$HOME"
            "$app/ggrun" update
          )
          "$app/ggrun" version --json > "$upgrade/after.json"
          sha256sum --check "$upgrade/preserved.sha256"
          python3 - "$upgrade" "$previous" "$release_commit" <<'PY'
          import json, os, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          previous = sys.argv[2]
          before = json.loads((root / "before.json").read_text())
          after = json.loads((root / "after.json").read_text())
          exe = (root / "home/ggrun/.bin/ggrun").resolve()
          if (before.get("version") != previous or before.get("revision") != sys.argv[3]
                  or Path(before.get("executable_resolved", "")) != exe):
              sys.exit(f"expected installed release {previous}, got {before}")
          if after.get("revision") != os.environ["GITHUB_SHA"] or after.get("modified") is not False:
              sys.exit(f"update did not install the exact clean candidate: {after}")
          if before.get("revision") == after["revision"] or Path(after.get("executable_resolved", "")) != exe:
              sys.exit(f"update did not replace the installed release: {after}")
          print(f"Verified update from {previous} to {after['revision']}")
          PY

      # No --cpu. On a runner with no GPU ggrun detects that and plans for the
      # CPU itself, which is a better test than being told; on a self-hosted
      # machine with cards the same step exercises real placement.
      - name: Serve the downloaded model on whatever hardware exists
        run: python3 scripts/verify-installed-serving.py --launcher "$HOME/ggrun/ggrun" --model "$MODEL" --port 18843 --output evidence/downloaded

      # The 2048-token checks above are bounded smoke tests. The default user
      # launch picks context and backend itself: no --ctx, no --cpu.
      - name: Default launch of the recommended model (automatic context and backend)
        run: |
          python3 scripts/verify-installed-serving.py --launcher "$HOME/ggrun/ggrun" --model "$REC_MODEL" \
            --ctx 0 --port 18847 --timeout 1200 --request-timeout 600 --hash-model --output evidence/recommended-default

      # The installed TUI in a real terminal: recommendations, settings, resize,
      # filter, Configure -> Pre-launch -> default launch, Ctrl+C, relaunch.
      - name: Installed TUI journey
        run: |
          python3 -m pip install --quiet pexpect
          python3 scripts/verify-installed-tui.py --launcher "$HOME/ggrun/ggrun" --model "$MODEL" \
            --app-home "$HOME/ggrun" --port 18848 --output evidence/tui

      # Issue #64: a launch as root failed because root has no user session
      # bus. Serve as real root with no XDG_RUNTIME_DIR or
      # DBUS_SESSION_BUS_ADDRESS, then stop. Last, because it leaves root-owned
      # files in the install.
      - name: Serve as root without a user session (issue 64)
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/root-launch.log"
          sudo env -u XDG_RUNTIME_DIR -u DBUS_SESSION_BUS_ADDRESS \
            timeout 900 "$HOME/ggrun/ggrun" "$MODEL" --cpu --ctx 2048 --port 18845 > "$log" 2>&1 &
          up=0
          for _ in $(seq 300); do
            if curl -fs http://127.0.0.1:18845/health >/dev/null; then up=1; fi
            # Stop only once launch is done: a signal during post-launch
            # verification is not the documented Ctrl+C and was lost.
            if [ "$up" = 1 ] && grep -q "Press Ctrl+C to stop" "$log"; then break; fi
            sleep 2
          done
          sudo pkill -INT -x ggrun || true
          for _ in $(seq 90); do pgrep -x ggrun >/dev/null || pgrep -x llama-server >/dev/null || break; sleep 1; done
          cat "$log"
          [ "$up" = 1 ] || { echo "::error::root launch did not serve"; exit 1; }
          grep -q "backend memory scope" "$log" || { echo "::error::no contained launch"; exit 1; }
          if grep -qiE "user scope bus|XDG_RUNTIME_DIR" "$log"; then echo "::error::root still needs a user bus"; exit 1; fi
          if pgrep -x llama-server; then echo "::error::launch left a backend running"; exit 1; fi
          mkdir -p evidence && cp "$log" evidence/

      - name: Preserve install and serving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-install-evidence
          path: |
            evidence/
            ~/ggrun/.logs/setup-*.log


  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install candidate with a real packaged backend
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          go build -C go -trimpath -o ggrun.exe ./cmd/ggrun
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          $asset = 'ggrun-windows-x86_64-cpu.zip'
          $published = Join-Path $env:RUNNER_TEMP 'published'
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          New-Item -ItemType Directory -Force -Path $published,$candidate | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/raketenkater/ggrun/releases/download/v3.2.10/$asset" -OutFile "$published/$asset"
          Invoke-WebRequest -UseBasicParsing 'https://github.com/raketenkater/ggrun/releases/download/v3.2.10/SHA256SUMS' -OutFile "$published/SHA256SUMS"
          $line = Get-Content "$published/SHA256SUMS" | Where-Object { $_ -match " $([regex]::Escape($asset))$" }
          if (!$line -or (Get-FileHash "$published/$asset" -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line -split '\s+')[0]) { throw 'Published backend checksum mismatch' }
          Expand-Archive "$published/$asset" "$published/unpacked"
          $backend = Get-ChildItem "$published/unpacked" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (!$backend) { throw 'Published backend missing' }
          ./scripts/package-release.ps1 -AssetName $asset -ServerBin $backend.FullName -OutDir $candidate -LlmServerBin go/ggrun.exe
          $hash = (Get-FileHash "$candidate/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$candidate/SHA256SUMS" -Encoding ASCII
          ./install.ps1 -InstallDir "$env:USERPROFILE/ggrun" -ReleaseDir $candidate -Backend cpu -NoPath -AssumeYes

      - name: Install published release through documented entry point
        if: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
        shell: powershell
        run: Get-Content install.ps1 -Raw | Invoke-Expression

      - name: ggrun runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # install.ps1 writes a ggrun.cmd wrapper at the install root and puts
          # the executable in .bin (Write-CmdWrapper). The wrapper is what the
          # docs tell users to run, so check that, not a bare ggrun.exe.
          $root = Join-Path $env:USERPROFILE 'ggrun'
          $cmd  = Join-Path $root 'ggrun.cmd'
          $exe  = Join-Path $root '.bin\ggrun.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $root -Recurse -Depth 1 | Select-Object FullName; throw "ggrun.exe not at $exe" }
          if (-not (Test-Path $cmd)) { throw "ggrun.cmd wrapper not at $cmd" }
          & $cmd --version
          if ($LASTEXITCODE -ne 0) { throw "Wrapper version failed" }
          & $cmd detect | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Wrapper detect failed" }

      # Candidate jobs must run this commit; the documented Windows installer
      # installs the published launcher, which must report the latest tag.
      - name: Installed launcher identity
        shell: powershell
        env:
          PUBLISHED: ${{ github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $exe = "$env:USERPROFILE\ggrun\.bin\ggrun.exe"
          $json = & $exe version --json
          if ($LASTEXITCODE -ne 0) { throw 'version --json failed' }
          $json | Set-Content evidence/launcher-identity.json -Encoding ASCII
          Get-ChildItem "$env:USERPROFILE\ggrun\.bin" -Filter '*.exe' | Get-FileHash -Algorithm SHA256 |
            Select-Object Hash, Path | Format-Table -AutoSize | Out-String -Width 400 | Set-Content evidence/installed-sha256.txt
          $id = $json | ConvertFrom-Json
          if ($env:PUBLISHED -eq 'true') {
            $tag = $env:RELEASE_TAG
            if (-not $tag) { $tag = (Invoke-RestMethod https://api.github.com/repos/raketenkater/ggrun/releases/latest).tag_name }
            if ($id.version -ne $tag) { throw "installed launcher reports $($id.version), expected $tag" }
          } elseif ($id.revision -ne $env:GITHUB_SHA) {
            throw "installed launcher revision '$($id.revision)' is not this commit $env:GITHUB_SHA"
          }
          Write-Host "launcher identity verified: $json"

      - name: The installed backend runs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-ChildItem "$env:USERPROFILE\ggrun\.bin" -Filter 'llama-server*.exe' -ErrorAction SilentlyContinue
          if (-not $found) { throw "no backend installed" }
          foreach ($b in $found) { Write-Host $b.FullName; & $b.FullName --version; if ($LASTEXITCODE -ne 0) { throw "Backend version failed" } }

      # The architecture literals live in llama.dll, not llama-server.exe; before
      # PE imports were followed the probe read only the .exe and reported every
      # architecture, even "llama", as unsupported.
      - name: The architecture probe reads the installed backend
        shell: powershell
        run: |
          $env:GGRUN_ARCH_PROBE_BACKEND = "$env:USERPROFILE\ggrun\.bin\llama-server.exe"
          go test -C go -count=1 ./pkg/backends -run TestArchProbeOnInstalledBackend -v
          if ($LASTEXITCODE -ne 0) { throw 'the architecture probe cannot read the installed backend' }

      # Same as the Linux job: the documented downloader, run first so both
      # serve steps share the one 563 MB download.
      - name: Download a model the documented way
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = "$env:USERPROFILE\ggrun"
          & "$h\.bin\ggrun.exe" download $env:E2E_REPO --quant $env:E2E_QUANT
          if ($LASTEXITCODE -ne 0) { throw "ggrun download exited $LASTEXITCODE" }
          $got = Get-ChildItem "$h\models" -Filter '*Q4_0*.gguf' -ErrorAction SilentlyContinue
          if (-not $got) {
            Get-ChildItem "$h\models" -Recurse | Select-Object FullName
            throw "ggrun download produced no $env:E2E_QUANT gguf"
          }
          Write-Host $got[0].FullName
          "MODEL=$($got[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Follow ggrun's recommendation for this runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = "$env:USERPROFILE\ggrun"
          $out = python scripts/verify-recommended-download.py --launcher "$h\.bin\ggrun.exe" --models-dir "$h\models" --output evidence/recommended --max-download-gb 6
          if ($LASTEXITCODE -ne 0) { throw 'recommended download failed' }
          $line = $out | Where-Object { $_ -like 'MODEL=*' } | Select-Object -Last 1
          ("REC_MODEL=" + $line.Substring(6)) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Serve a model
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/verify-installed-serving.py --launcher "$env:USERPROFILE\ggrun\ggrun.cmd" --model "$env:MODEL" --cpu --port 18842 --output evidence/cpu --hash-model
          if ($LASTEXITCODE -ne 0) { throw 'Installed serving check failed' }

      - name: Reinstall candidate without resetting configuration
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:USERPROFILE 'ggrun'
          $config = Join-Path $app '.config/config'
          Add-Content $config "`nLLM_PORT=19249"
          $before = (Get-FileHash $config).Hash
          ./install.ps1 -InstallDir $app -ReleaseDir "$env:RUNNER_TEMP/candidate" -Backend cpu -NoPath -AssumeYes
          if ((Get-FileHash $config).Hash -ne $before) { throw 'Reinstall changed user configuration' }

      # No --cpu: let ggrun decide from the hardware it finds.
      - name: Serve the downloaded model on whatever hardware exists
        shell: powershell
        run: |
          python scripts/verify-installed-serving.py --launcher "$env:USERPROFILE\ggrun\ggrun.cmd" --model "$env:MODEL" --port 18844 --output evidence/downloaded
          if ($LASTEXITCODE -ne 0) { throw 'Installed serving check failed' }

      - name: Default launch of the recommended model (automatic context and backend)
        shell: powershell
        run: |
          python scripts/verify-installed-serving.py --launcher "$env:USERPROFILE\ggrun\ggrun.cmd" --model "$env:REC_MODEL" --ctx 0 --port 18847 --timeout 1200 --request-timeout 600 --hash-model --output evidence/recommended-default
          if ($LASTEXITCODE -ne 0) { throw 'Default launch of the recommended model failed' }

      # The installed TUI in a real Windows console (ConPTY via pywinpty).
      - name: Installed TUI journey
        shell: powershell
        run: |
          python -m pip install --quiet pywinpty
          python scripts/verify-installed-tui.py --launcher "$env:USERPROFILE\ggrun\.bin\ggrun.exe" --model "$env:MODEL" --app-home "$env:USERPROFILE\ggrun" --port 18848 --output evidence/tui
          if ($LASTEXITCODE -ne 0) { throw 'Installed TUI journey failed' }

      - name: Exercise Windows server hardening script with candidate CPU bundle
        if: ${{ !(github.event_name == 'release' || github.event_name == 'schedule' || inputs.published == true) }}
        shell: powershell
        run: |
          ./scripts/test-windows-server.ps1 -WorkDir "$env:RUNNER_TEMP/server check" `
            -ReleaseDir "$env:RUNNER_TEMP/candidate" -Backend cpu -MinWeightDevices 0 `
            -ModelPath "$env:MODEL" -Context 2048 -StartupTimeout 300 -Port 18846

      - name: Preserve Windows server hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-hardening
          path: |
            ${{ runner.temp }}/server check/evidence/**
            !${{ runner.temp }}/server check/evidence/**/downloaded-models/**

      - name: Preserve install and serving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-evidence
          path: |
            evidence/
            ~/ggrun/.logs/

  # The same human flow on a machine with real cards. GitHub's hosted runners
  # have no GPU, so everything above proves the CPU path only: VRAM admission,
  # placement across devices and split mode are untested by any job here.
  #
  # Opt-in, and skipped rather than queued when the runner does not exist:
  # register a self-hosted runner labelled "gpu" and set the repository variable
  # GGRUN_GPU_RUNNER to "true". Without the `if` this job would sit in the queue
  # forever on a repo with no such runner.
  gpu:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.GGRUN_GPU_RUNNER == 'true'
    # Linux label so a Windows GPU runner cannot pick up this job.
    runs-on: [self-hosted, gpu, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner is not a fresh machine, so install somewhere of our
      # own and leave whatever ggrun the owner already has alone.
      - name: Install
        env:
          LLM_INSTALL_SCAN_SYSTEM: "0"
          LLM_SETUP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          LLM_APP_HOME: ${{ runner.temp }}/ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # shellcheck disable=SC2002 # piping the documented entry point is the test
          cat setup.sh | bash

      - name: The GPUs are visible to ggrun
        env:
          LLM_APP_HOME: ${{ runner.temp }}/ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CUDA_DEVICE_ORDER: PCI_BUS_ID
        run: |
          set -euo pipefail
          g="$LLM_APP_HOME/ggrun"
          "$g" --version
          "$g" detect | tee detect.txt
          grep -qiE 'cuda|rocm|vulkan|metal|gpu' detect.txt || {
            echo "::error::this runner is labelled gpu and ggrun found no GPU"; exit 1; }

      - name: Download and serve on the GPUs
        env:
          LLM_APP_HOME: ${{ runner.temp }}/ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CUDA_DEVICE_ORDER: PCI_BUS_ID
          GPU_MODEL_REPO: ${{ inputs.gpu_model_repo }}
          GPU_MODEL_QUANT: ${{ inputs.gpu_model_quant }}
          GPU_MODEL_PATH: ${{ inputs.gpu_model_path }}
          GPU_CONTEXT: ${{ inputs.gpu_context }}
          GPU_STARTUP_TIMEOUT: ${{ inputs.gpu_startup_timeout }}
          GPU_REQUEST_TIMEOUT: ${{ inputs.gpu_request_timeout }}
          GPU_MIN_WEIGHT_DEVICES: ${{ inputs.gpu_min_weight_devices }}
          GPU_CLAUDE_CODE: ${{ inputs.gpu_claude_code }}
        run: |
          set -euo pipefail
          # The models that actually stress placement are too large to fetch per
          # run, so a path on the runner is how that shape gets covered. The
          # default still downloads, because fetching a model is part of the
          # documented flow and has to keep being tested.
          if [ -n "${GPU_MODEL_PATH:-}" ]; then
            [ -f "$GPU_MODEL_PATH" ] || {
              echo "::error::gpu_model_path is not a file on this runner: $GPU_MODEL_PATH"; exit 1; }
            source_args=(--model "$GPU_MODEL_PATH")
          else
            source_args=(--repo "${GPU_MODEL_REPO:-$E2E_REPO}" --quant "${GPU_MODEL_QUANT:-$E2E_QUANT}")
          fi
          mode_args=()
          if [ "${GPU_CLAUDE_CODE:-true}" != "false" ]; then mode_args=(--claude-code); fi
          python3 scripts/verify-gpu-install.py --launcher "$LLM_APP_HOME/ggrun" \
            "${source_args[@]}" "${mode_args[@]}" \
            --ctx "${GPU_CONTEXT:-2048}" --timeout "${GPU_STARTUP_TIMEOUT:-300}" \
            --request-timeout "${GPU_REQUEST_TIMEOUT:-120}" \
            --min-weight-devices "${GPU_MIN_WEIGHT_DEVICES:-1}" \
            --port 18845 --output evidence/gpu --relaunch

      - name: Preserve GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-install-evidence
          path: |
            evidence/gpu/*.json
            evidence/gpu/*.log
            evidence/gpu/relaunch/*.json
            evidence/gpu/relaunch/*.log
            evidence/gpu/claude-code/*.json
            evidence/gpu/claude-code/*.log

  # Same flow on a Windows machine with cards. Gated on its own variable so one
  # platform's runner being absent never leaves the other's job queued.
  # Register a self-hosted Windows runner labelled "gpu" and set
  # GGRUN_GPU_RUNNER_WINDOWS to "true".
  gpu-windows:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.GGRUN_GPU_RUNNER_WINDOWS == 'true'
    runs-on: [self-hosted, gpu, Windows]
    timeout-minutes: 60
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      # Install THIS commit, packaged the way the hosted windows job does it.
      # Installing the published release instead tested a binary 50 commits
      # behind main: v3.2.8 sent a fixed 6924-token cache canary into a
      # 2048-token context and exited, a bug #30 had already fixed on main.
      #
      # Called with parameters rather than piped. A self-hosted machine is not
      # a fresh one: -InstallDir keeps this out of the owner's real ~\ggrun, and
      # -NoPath leaves their PATH alone. No -Backend: install.ps1 detects the
      # card, finds no CUDA bundle in the candidate, installs the CPU bundle
      # and adds the prebuilt llama.cpp CUDA backend, as it does for a user.
      - name: Install candidate
        shell: powershell
        env:
          LLM_APP_HOME: ${{ runner.temp }}\ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          LLM_INSTALL_SCAN_SYSTEM: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          go build -C go -trimpath -o ggrun.exe ./cmd/ggrun
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          $asset = 'ggrun-windows-x86_64-cpu.zip'
          $published = Join-Path $env:RUNNER_TEMP 'published'
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          New-Item -ItemType Directory -Force -Path $published,$candidate | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://github.com/raketenkater/ggrun/releases/download/v3.2.10/$asset" -OutFile "$published/$asset"
          Invoke-WebRequest -UseBasicParsing 'https://github.com/raketenkater/ggrun/releases/download/v3.2.10/SHA256SUMS' -OutFile "$published/SHA256SUMS"
          $line = Get-Content "$published/SHA256SUMS" | Where-Object { $_ -match " $([regex]::Escape($asset))$" }
          if (!$line -or (Get-FileHash "$published/$asset" -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line -split '\s+')[0]) { throw 'Published backend checksum mismatch' }
          Expand-Archive "$published/$asset" "$published/unpacked"
          $backend = Get-ChildItem "$published/unpacked" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (!$backend) { throw 'Published backend missing' }
          ./scripts/package-release.ps1 -AssetName $asset -ServerBin $backend.FullName -OutDir $candidate -LlmServerBin go/ggrun.exe
          $hash = (Get-FileHash "$candidate/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$candidate/SHA256SUMS" -Encoding ASCII
          .\install.ps1 -InstallDir $env:LLM_APP_HOME -ReleaseDir $candidate -NoPath -AssumeYes
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "install.ps1 exited $LASTEXITCODE" }

      - name: The GPUs are visible to ggrun
        shell: powershell
        env:
          LLM_APP_HOME: ${{ runner.temp }}\ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $g = Join-Path $env:LLM_APP_HOME '.bin\ggrun.exe'
          if (-not (Test-Path $g)) { throw "ggrun.exe not at $g" }
          & $g --version
          & $g detect | Tee-Object -FilePath detect.txt
          if (-not (Select-String -Path detect.txt -Pattern 'cuda|vulkan|gpu' -Quiet)) {
            throw "this runner is labelled gpu and ggrun found no GPU"
          }

      - name: Download and serve on the GPUs
        shell: powershell
        env:
          LLM_APP_HOME: ${{ runner.temp }}\ggrun-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $g = Join-Path $env:LLM_APP_HOME '.bin\ggrun.exe'
          & $g download $env:E2E_REPO --quant $env:E2E_QUANT
          if ($LASTEXITCODE -ne 0) { throw "ggrun download exited $LASTEXITCODE" }
          $got = Get-ChildItem (Join-Path $env:LLM_APP_HOME 'models') -Filter '*Q4_0*.gguf' -ErrorAction SilentlyContinue
          if (-not $got) { throw "no downloaded model" }
          python scripts/verify-installed-serving.py --launcher $g --model $got[0].FullName --port 18846 --output evidence/gpu-windows
          if ($LASTEXITCODE -ne 0) { throw "installed serving check failed" }
          # A run that quietly placed everything on the CPU would pass every
          # check above. Require a real, nonzero weight allocation on a device.
          # Backends word this differently, so match either spelling and drop
          # the KV, compute and output buffers, which a device allocates even
          # when the weights stayed on the host:
          #   mainline  CUDA0 model buffer size =   526.50 MiB
          #   ik_llama  llm_load_tensors: CUDA1 buffer size =   526.50 MiB
          $log = Join-Path 'evidence/gpu-windows' 'serve.log'
          $weights = Select-String -Path $log -Pattern '(CUDA\d+|Vulkan\d+|Metal).*buffer size *= *[1-9][0-9.]* MiB' |
            Where-Object { $_.Line -notmatch 'KV buffer|compute buffer|output buffer' }
          if (-not $weights) {
            throw "No positive device weight allocation recorded"
          }

      - name: Preserve GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-windows-install-evidence
          path: evidence/
