name: Release

# Release bundles: Linux CPU/Vulkan, macOS Metal, Windows CPU.
# Linux CUDA (ik_llama) is an extra job; attach the asset only when that job succeeds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# The model CI serves. A real one: the stories fixtures have training contexts
# no real model has (stories15M caps a slot at 128 tokens), so CI kept asserting
# against behaviour no user ever meets. Pinned by repo revision and checksum.
env:
  E2E_MODEL_FILE: Qwen3.5-0.8B-Q4_0.gguf
  E2E_MODEL_URL: https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/8fea620810c4afa23dd6443f999a48574c1611a3/Qwen3.5-0.8B-Q4_0.gguf
  E2E_MODEL_SHA256: 57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf

jobs:
  preflight:
    name: preflight tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ELF relocation test tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf

      - name: Install Python test dependencies
        run: python3 -m pip install pytest huggingface_hub

      - name: Check Go formatting
        working-directory: go
        run: test -z "$(gofmt -l .)"

      - name: Run Go package tests
        working-directory: go
        run: go test ./...

      - name: Vet Go packages
        working-directory: go
        run: go vet ./...

      - name: parse_gguf tests
        run: python3 tests/test_parse_gguf.py
      - name: estimator tests
        run: bash tests/test_estimator.sh
      - name: safety tests
        run: bash tests/test_safety.sh
      - name: setup-home tests
        run: bash tests/test_setup_home.sh
      - name: model-index tests
        run: bash tests/test_model_index.sh
      - name: moe-placement tests
        run: bash tests/test_moe_placement.sh
      - name: pytest
        run: python3 -m pytest tests/test_downloader_quant.py tests/test_update_recommendations.py tests/test_measure_bandwidth.py tests/test_install_contracts.py tests/test_release_relocation.py

  package:
    name: package ${{ matrix.asset }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # macOS is deprecated and best-effort: nobody here has a Mac to reproduce on,
    # so it must never hold a release. It still builds and its bundle is still
    # attached when it succeeds; when it fails, publish goes ahead without it.
    # `publish` merges whatever artifacts exist, so a missing asset degrades to
    # "no macOS download in this release" rather than no release.
    continue-on-error: ${{ matrix.optional || false }}
    env:
      LLAMA_CPP_REF: d2462f8f7ac6d80070a587ffebf6cd73730f4280

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ggrun-linux-x86_64-cpu.tar.gz
            cmake_flags: -DGGML_NATIVE=OFF
          - os: ubuntu-latest
            asset: ggrun-linux-x86_64-vulkan.tar.gz
            cmake_flags: -DGGML_VULKAN=ON -DGGML_NATIVE=OFF
          - os: macos-14
            asset: ggrun-macos-arm64-metal.tar.gz
            cmake_flags: -DGGML_METAL=ON -DGGML_NATIVE=OFF
            optional: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      # patchelf is not optional: package-release.sh uses it to rewrite the
      # backend's RUNPATH to $ORIGIN and refuses to build a bundle without it.
      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libvulkan-dev glslc glslang-tools spirv-headers vulkan-tools patchelf

      - name: Clone pinned llama.cpp
        run: |
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth=1 origin "$LLAMA_CPP_REF"
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD

      - name: Build llama-server
        run: |
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}
          cmake --build /tmp/llama.cpp/build --config Release -j 3 -t llama-server

      - name: Smoke-test backend binary
        run: /tmp/llama.cpp/build/bin/llama-server --version

      - name: Smoke-test real model serving
        shell: bash
        run: |
          model="$RUNNER_TEMP/$E2E_MODEL_FILE"
          curl -fL --retry 3 "$E2E_MODEL_URL" -o "$model"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$E2E_MODEL_SHA256  $model" | sha256sum -c -
          else
            echo "$E2E_MODEL_SHA256  $model" | shasum -a 256 -c -
          fi
          /tmp/llama.cpp/build/bin/llama-server -m "$model" --host 127.0.0.1 --port 19141 >"$RUNNER_TEMP/llama-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:19141/health >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/llama-serve.log"
            exit 1
          fi
          curl -fsS http://127.0.0.1:19141/v1/models >/dev/null
          kill -TERM "$server_pid"
          wait "$server_pid"
          trap - EXIT

      - name: Build Go ggrun
        working-directory: go
        run: |
          version="${GITHUB_REF_NAME}"
          case "$version" in
            v*) ;;
            *) version="" ;;  # non-tag builds keep the in-source default
          esac
          ldflags="-s -w"
          if [ -n "$version" ]; then
            ldflags="$ldflags -X github.com/raketenkater/ggrun/pkg/update.currentVersion=$version"
          fi
          go build -trimpath -ldflags="$ldflags" -o ggrun ./cmd/ggrun

      - name: Package
        run: scripts/package-release.sh "${{ matrix.asset }}" /tmp/llama.cpp/build/bin/llama-server dist

      # The smoke test above runs the binary inside its build tree, where its
      # libraries happen to sit beside it. That is exactly why v3.2.8 shipped a
      # backend that could not load anywhere else (#28): the test passed and the
      # bundle was broken. So run the PACKAGED binary from a fresh directory
      # with the build tree hidden, leaving it nothing to load but what the
      # bundle actually ships.
      - name: Verify the packaged backend runs outside the build tree
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/llama.cpp/build/bin /tmp/llama.cpp/build/bin.hidden
          trap 'mv /tmp/llama.cpp/build/bin.hidden /tmp/llama.cpp/build/bin 2>/dev/null || true' EXIT
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked"; mkdir -p "$unpacked"
          tar -xzf "dist/${{ matrix.asset }}" -C "$unpacked"
          server="$(find "$unpacked" -type f -name llama-server -perm -u+x | head -1)"
          test -n "$server" || { echo "::error::no llama-server in ${{ matrix.asset }}"; exit 1; }
          "$server" --version

      - name: Install and exercise the candidate archive
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          backend="${asset%.tar.gz}"; backend="${backend##*-}"
          (cd dist && shasum -a 256 "$asset" > SHA256SUMS)
          export LLM_APP_HOME="$RUNNER_TEMP/candidate-app"
          export LLM_SETUP_MODE=release LLM_SETUP_BACKEND="$backend"
          export LLM_INSTALL_RELEASE_DIR="$PWD/dist" LLM_INSTALL_SCAN_SYSTEM=0
          export LLM_SETUP_NONINTERACTIVE=1 LLM_SETUP_PY_DEPS=skip
          ./setup.sh
          # Distinct ports for the two checks. They used one, and the second
          # bound before the first server's socket had gone, failing with
          # "Address already in use" the moment the first check started passing.
          python3 scripts/verify-installed-serving.py --launcher "$LLM_APP_HOME/ggrun" \
            --model "$RUNNER_TEMP/$E2E_MODEL_FILE" --cpu --port 19146 --output "$RUNNER_TEMP/candidate-evidence"
          printf '\nLLM_PORT=19149\n' >> "$LLM_APP_HOME/.config/config"
          cp "$LLM_APP_HOME/.config/config" "$RUNNER_TEMP/config-before-upgrade"
          ./setup.sh
          cmp "$RUNNER_TEMP/config-before-upgrade" "$LLM_APP_HOME/.config/config"
          python3 scripts/verify-installed-serving.py --launcher "$LLM_APP_HOME/ggrun" \
            --model "$RUNNER_TEMP/$E2E_MODEL_FILE" --cpu --port 19152 --output "$RUNNER_TEMP/upgrade-evidence"

      - name: Preserve candidate installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.asset }}
          path: |
            ${{ runner.temp }}/candidate-evidence/
            ${{ runner.temp }}/upgrade-evidence/
            ${{ runner.temp }}/candidate-app/.logs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  package-windows:
    name: package ggrun-windows-x86_64-cpu.zip
    needs: preflight
    runs-on: windows-latest
    env:
      LLAMA_CPP_REF: d2462f8f7ac6d80070a587ffebf6cd73730f4280
      ASSET: ggrun-windows-x86_64-cpu.zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Clone pinned llama.cpp
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'llama.cpp'
          git init $src
          git -C $src remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C $src fetch --depth=1 origin $env:LLAMA_CPP_REF
          git -C $src checkout --detach FETCH_HEAD
          "LLAMA_CPP_DIR=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build llama-server
        shell: pwsh
        run: |
          $build = Join-Path $env:LLAMA_CPP_DIR 'build'
          cmake -S $env:LLAMA_CPP_DIR -B $build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build $build --config Release --parallel 3 --target llama-server
          $server = Get-ChildItem -Path $build -Filter llama-server.exe -Recurse | Select-Object -First 1
          if (!$server) { throw 'llama-server.exe not found after build' }
          & $server.FullName --version
          "LLAMA_SERVER_PATH=$($server.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test real model serving
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP $env:E2E_MODEL_FILE
          Invoke-WebRequest -Uri $env:E2E_MODEL_URL -OutFile $model
          $actual = (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant()
          if ($actual -ne $env:E2E_MODEL_SHA256) { throw 'Model checksum mismatch' }
          $stdout = Join-Path $env:RUNNER_TEMP 'llama-serve.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'llama-serve.stderr.log'
          $proc = Start-Process -FilePath $env:LLAMA_SERVER_PATH -ArgumentList @('-m', $model, '--host', '127.0.0.1', '--port', '19142') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              try {
                Invoke-RestMethod -Uri 'http://127.0.0.1:19142/health' -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (!$ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'Windows llama-server did not load and serve the smoke model'
            }
            Invoke-RestMethod -Uri 'http://127.0.0.1:19142/v1/models' -TimeoutSec 5 | Out-Null
          } finally {
            if (!$proc.HasExited) { & taskkill /PID $proc.Id /T /F | Out-Null }
          }

      - name: Build Go ggrun
        working-directory: go
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $ldflags = '-s -w'
          if ($version -like 'v*') {
            $ldflags = "$ldflags -X github.com/raketenkater/ggrun/pkg/update.currentVersion=$version"
          }
          go build -trimpath -ldflags $ldflags -o ggrun.exe ./cmd/ggrun

      - name: Package
        shell: pwsh
        run: scripts/package-release.ps1 -AssetName $env:ASSET -ServerBin $env:LLAMA_SERVER_PATH -OutDir dist -LlmServerBin go/ggrun.exe

      - name: Install and exercise the candidate archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD "dist/$env:ASSET"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $env:ASSET" | Set-Content dist/SHA256SUMS -Encoding ASCII
          $app = Join-Path $env:RUNNER_TEMP 'candidate-app'
          ./install.ps1 -InstallDir $app -ReleaseDir "$PWD/dist" -NoPath -AssumeYes
          if ($LASTEXITCODE -ne 0) { throw 'Candidate install failed' }
          python scripts/verify-installed-serving.py --launcher "$app/ggrun.cmd" --model "$env:RUNNER_TEMP/$env:E2E_MODEL_FILE" --cpu --port 19147 --output "$env:RUNNER_TEMP/candidate-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate serving failed' }
          $config = Join-Path $app '.config/config'
          Add-Content $config "`nLLM_PORT=19149"
          $before = (Get-FileHash $config).Hash
          ./install.ps1 -InstallDir $app -ReleaseDir "$PWD/dist" -NoPath -AssumeYes
          if ($LASTEXITCODE -ne 0) { throw 'Candidate reinstall failed' }
          if ((Get-FileHash $config).Hash -ne $before) { throw 'Upgrade changed user configuration' }
          python scripts/verify-installed-serving.py --launcher "$app/ggrun.cmd" --model "$env:RUNNER_TEMP/$env:E2E_MODEL_FILE" --cpu --port 19153 --output "$env:RUNNER_TEMP/upgrade-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded candidate serving failed' }

      - name: Preserve candidate installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-windows-cpu
          path: |
            ${{ runner.temp }}/candidate-evidence/
            ${{ runner.temp }}/upgrade-evidence/
            ${{ runner.temp }}/candidate-app/.logs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}

  package-cuda:
    name: package ggrun-linux-x86_64-cuda.tar.gz
    needs: preflight
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    env:
      IK_LLAMA_REF: 1fddd12ba861c4815a8633f14d9c5670692099cc
      ASSET: ggrun-linux-x86_64-cuda.tar.gz

    steps:
      # binutils and patchelf are build dependencies too: this job ends by
      # calling scripts/package-release.sh, which reads RUNPATH with readelf and
      # rewrites it with patchelf. Without them the bundle is refused AFTER the
      # ~2.5 hour CUDA compile, which is the worst possible place to find out.
      - name: Install CUDA build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libcurl4-openssl-dev libgomp1 \
            binutils patchelf
          # Fail in seconds if a package silently went missing, not in hours.
          for t in patchelf readelf cmake; do
            command -v "$t" >/dev/null || { echo "::error::$t missing after install"; exit 1; }
          done

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build pinned ik_llama CUDA bundle
        run: OUT_DIR=dist scripts/build-linux-cuda-bundle.sh

      # This job's smoke test below exports LD_LIBRARY_PATH to the bundle's own
      # bin before running the binary, which hides a mis-pointed RUNPATH exactly
      # the way running inside the build tree did for the cpu bundle. A user
      # running the backend directly exports nothing. Assert relocatability
      # separately, and by inspection: it needs no GPU driver, so it cannot
      # produce a false failure on a runner that has none.
      # shell: bash is required, not cosmetic. This job runs in a container
      # where the default run shell is sh, and dash rejects `set -o pipefail`
      # on line 1 -- which failed a release after a 2h23m build that had
      # already succeeded.
      - name: The packaged backend is relocatable
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cuda-check && mkdir -p /tmp/cuda-check
          tar -xzf dist/${{ env.ASSET }} -C /tmp/cuda-check
          b="$(find /tmp/cuda-check -type f -name llama-server -perm -u+x | head -1)"
          test -n "$b" || { echo "::error::no llama-server in ${{ env.ASSET }}"; exit 1; }
          rp="$(readelf -d "$b" | awk '/R(UN)?PATH/ { sub(/.*\[/,""); sub(/\].*/,""); print; exit }')"
          echo "RUNPATH: [$rp]"
          # shellcheck disable=SC2016 # ORIGIN is a literal ELF loader token
          case "$rp" in
            *'$ORIGIN'*) ;;
            *) echo "::error::CUDA backend RUNPATH is not \$ORIGIN: [$rp]"; exit 1 ;;
          esac

      - name: Smoke-test backend binary
        run: |
          tar -xzf dist/${{ env.ASSET }} -C /tmp
          box=/tmp/ggrun-linux-x86_64-cuda/bin
          export LD_LIBRARY_PATH="$box${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          if ! "$box/llama-server" --version; then
            out="$("$box/llama-server" --version 2>&1 || true)"
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -qE 'libcuda|libnvidia'; then
              echo "No CUDA driver on this runner; the bundle is still the install we ship."
            else
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, package-windows, package-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ggrun-*
          merge-multiple: true

      - name: Include installers in the checksum set
        run: |
          cp install.sh install.ps1 dist/

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'install.sh' -o -name 'install.ps1' \) -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle
